<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1b5e20"/>
  <!-- Hokage monument -->
  <polygon points="200,40 50,200 350,200" fill="#5d4037"/>
  <polygon points="280,70 180,200 380,200" fill="#6d4c41"/>
  <!-- Faces -->
  <circle cx="130" cy="140" r="18" fill="#795548"/>
  <circle cx="180" cy="130" r="18" fill="#795548"/>
  <circle cx="230" cy="140" r="18" fill="#795548"/>
  <circle cx="280" cy="135" r="18" fill="#795548"/>
  <!-- Eyes on faces -->
  <circle cx="125" cy="137" r="3" fill="#333"/>
  <circle cx="135" cy="137" r="3" fill="#333"/>
  <circle cx="175" cy="127" r="3" fill="#333"/>
  <circle cx="185" cy="127" r="3" fill="#333"/>
  <circle cx="225" cy="137" r="3" fill="#333"/>
  <circle cx="235" cy="137" r="3" fill="#333"/>
  <circle cx="275" cy="132" r="3" fill="#333"/>
  <circle cx="285" cy="132" r="3" fill="#333"/>
  <!-- Village below -->
  <rect x="60" y="200" width="20" height="30" fill="#8d6e63"/>
  <rect x="100" y="210" width="15" height="20" fill="#a1887f"/>
  <rect x="300" y="205" width="18" height="25" fill="#8d6e63"/>
  <rect x="340" y="210" width="15" height="20" fill="#a1887f"/>
  <!-- Trees -->
  <circle cx="40" cy="195" r="12" fill="#4caf50"/>
  <circle cx="360" cy="195" r="12" fill="#4caf50"/>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="bold">Монумент Хокаге</text>
</svg>
