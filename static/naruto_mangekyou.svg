<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Mangekyou Sharingan -->
  <circle cx="200" cy="130" r="50" fill="#c62828"/>
  <circle cx="200" cy="130" r="35" fill="#b71c1c"/>
  <circle cx="200" cy="130" r="15" fill="#333"/>
  <!-- Tomoe pattern (Mangekyou) -->
  <path d="M200,80 Q230,110 200,130 Q170,110 200,80" fill="#333"/>
  <path d="M160,150 Q190,130 200,150 Q180,170 160,150" fill="#333"/>
  <path d="M240,150 Q210,130 200,150 Q220,170 240,150" fill="#333"/>
  <!-- Inner pattern -->
  <path d="M200,100 Q215,115 200,130 Q185,115 200,100" fill="#1a1a1a"/>
  <path d="M180,145 Q195,135 200,145 Q190,155 180,145" fill="#1a1a1a"/>
  <path d="M220,145 Q205,135 200,145 Q210,155 220,145" fill="#1a1a1a"/>
  <!-- Glow -->
  <circle cx="200" cy="130" r="55" fill="none" stroke="#e1bee7" stroke-width="2" opacity="0.5"/>
  <text x="200" y="240" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="bold">Мангекё Шаринган</text>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.7)">Шаринган кошачьего глаза</text>
</svg>
