<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- Kurama mode aura -->
  <circle cx="200" cy="150" r="100" fill="#ff6f00" opacity="0.15"/>
  <circle cx="200" cy="150" r="80" fill="#ff6f00" opacity="0.2"/>
  <circle cx="200" cy="150" r="60" fill="#ff6f00" opacity="0.25"/>
  <!-- Naruto silhouette -->
  <circle cx="200" cy="100" r="30" fill="#ffcc80"/>
  <rect x="180" y="130" width="40" height="50" rx="5" fill="#ff6f00"/>
  <!-- Fox ears -->
  <polygon points="175,75 165,45 185,70" fill="#ff6f00"/>
  <polygon points="225,75 235,45 215,70" fill="#ff6f00"/>
  <!-- Chakra arms -->
  <path d="M170,150 Q120,100 100,150 Q80,200 130,180" fill="#ff6f00" opacity="0.6"/>
  <path d="M230,150 Q280,100 300,150 Q320,200 270,180" fill="#ff6f00" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="192" cy="95" r="5" fill="#c62828"/>
  <circle cx="208" cy="95" r="5" fill="#c62828"/>
  <text x="200" y="250" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fff" font-weight="bold">Режим Кьюби</text>
</svg>
