<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#ffcc80"/>
  <!-- Naruto headband -->
  <rect x="100" y="80" width="200" height="60" rx="5" fill="#455a64"/>
  <rect x="170" y="90" width="60" height="40" rx="3" fill="#90a4ae"/>
  <!-- Leaf symbol on headband -->
  <path d="M200,95 Q190,110 200,125 Q210,110 200,95" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Spiky hair -->
  <polygon points="150,80 170,30 190,80" fill="#f9a825"/>
  <polygon points="180,75 200,20 220,75" fill="#f9a825"/>
  <polygon points="210,80 230,35 250,80" fill="#f9a825"/>
  <!-- Face -->
  <circle cx="200" cy="160" r="50" fill="#ffcc80"/>
  <!-- Whiskers -->
  <line x1="140" y1="150" x2="160" y2="155" stroke="#333" stroke-width="1"/>
  <line x1="140" y1="160" x2="160" y2="160" stroke="#333" stroke-width="1"/>
  <line x1="140" y1="170" x2="160" y2="165" stroke="#333" stroke-width="1"/>
  <line x1="240" y1="150" x2="260" y2="155" stroke="#333" stroke-width="1"/>
  <line x1="240" y1="160" x2="260" y2="160" stroke="#333" stroke-width="1"/>
  <line x1="240" y1="170" x2="260" y2="165" stroke="#333" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="185" cy="150" r="6" fill="#2196f3"/>
  <circle cx="215" cy="150" r="6" fill="#2196f3"/>
  <!-- Mouth -->
  <path d="M190,180 Q200,190 210,180" fill="none" stroke="#333" stroke-width="2"/>
  <text x="200" y="280" text-anchor="middle" font-family="system-ui" font-size="16" fill="#333" font-weight="bold">Наруто Узумаки</text>
</svg>
