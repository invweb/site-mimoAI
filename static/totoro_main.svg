<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d5ba"/>
      <stop offset="100%" style="stop-color:#5b8c5a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Trees -->
  <circle cx="100" cy="350" r="60" fill="#2d5a27"/>
  <circle cx="700" cy="350" r="50" fill="#2d5a27"/>
  <circle cx="650" cy="370" r="40" fill="#3a7d32"/>
  <!-- Totoro silhouette -->
  <ellipse cx="400" cy="280" rx="120" ry="140" fill="#78909c"/>
  <ellipse cx="400" cy="160" rx="80" ry="70" fill="#78909c"/>
  <!-- Ears -->
  <ellipse cx="350" cy="110" rx="20" ry="40" fill="#78909c" transform="rotate(-15, 350, 110)"/>
  <ellipse cx="450" cy="110" rx="20" ry="40" fill="#78909c" transform="rotate(15, 450, 110)"/>
  <!-- Eyes -->
  <circle cx="370" cy="150" r="15" fill="white"/>
  <circle cx="430" cy="150" r="15" fill="white"/>
  <circle cx="370" cy="150" r="8" fill="#333"/>
  <circle cx="430" cy="150" r="8" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="400" cy="175" rx="12" ry="8" fill="#546e7a"/>
  <!-- Belly -->
  <ellipse cx="400" cy="300" rx="70" ry="80" fill="#b0bec5"/>
  <!-- Text -->
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="white" font-weight="bold">Мой сосед Тоторо</text>
</svg>
