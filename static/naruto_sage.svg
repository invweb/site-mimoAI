<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6f00"/>
      <stop offset="100%" style="stop-color:#ffab00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Sage mode eyes -->
  <circle cx="200" cy="130" r="35" fill="#fff"/>
  <circle cx="200" cy="130" r="25" fill="#f57c00"/>
  <circle cx="200" cy="130" r="10" fill="#333"/>
  <!-- Orange rings around eyes -->
  <circle cx="200" cy="130" r="35" fill="none" stroke="#c62828" stroke-width="3"/>
  <!-- Eyebrows -->
  <line x1="165" y1="95" x2="235" y2="95" stroke="#333" stroke-width="4"/>
  <!-- Glow effect -->
  <circle cx="200" cy="130" r="50" fill="none" stroke="#ffeb3b" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="130" r="60" fill="none" stroke="#ffeb3b" stroke-width="1" opacity="0.3"/>
  <text x="200" y="240" text-anchor="middle" font-family="system-ui" font-size="18" fill="#fff" font-weight="bold">Режим мудреца</text>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui" font-size="12" fill="rgba(255,255,255,0.8)">Sage Mode</text>
</svg>
